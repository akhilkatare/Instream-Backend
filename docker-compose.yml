services:
  api:
    build: .
    container_name: instream-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app 
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: instream-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-instream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-instream}
      POSTGRES_DB: ${POSTGRES_DB:-instream}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-instream} -d ${POSTGRES_DB:-instream}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: instream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: